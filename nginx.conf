worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log stderr error;
  server_tokens off;

  include mime.types;
  types {
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;
  charset_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
  sendfile on;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  server {
    listen 8000;
    root /var/www;
    index index.html;
    charset UTF-8;
    # Keep directory redirects on the public HTTPS origin behind the proxy.
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    error_page 404 /404.html;

    location / {
      try_files $uri $uri/ =404;
    }

    # Astro fingerprints these files; pages and public assets can change in place.
    location /_astro/ {
      expires 1y;
      try_files $uri =404;
    }

    location = /404.html {
      internal;
    }
  }
}
