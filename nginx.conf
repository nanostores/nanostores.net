worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log stderr error;
  server_tokens off;

  include mime.types;
  types {
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;
  charset_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
  sendfile on;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  server {
    listen 8000;
    root /var/www;
    index index.html;
    charset UTF-8;
    # Keep directory redirects on the public HTTPS origin behind the proxy.
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    # Script and style rules are in each page's meta tag, because the hashes
    # belong to the page. A script-src here would be applied on top of them,
    # and also to Pagefind's worker, which would then need 'wasm-unsafe-eval'.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
    error_page 404 /404.html;

    location / {
      try_files $uri $uri/ =404;
    }

    # hplush/cloud exposes the container on host loopback only. Caddy is the
    # trusted ingress and replaces untrusted X-Forwarded-For with the client IP.
    # Keep that deployment boundary when moving this image to another host.
    location = /api/event {
      if ($request_method != POST) { return 405; }
      client_max_body_size 16k;
      proxy_pass https://lens.hplush.dev/api/event;
      proxy_http_version 1.1;
      proxy_set_header Host lens.hplush.dev;
      proxy_set_header User-Agent $http_user_agent;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_set_header Connection "";
      proxy_ssl_server_name on;
      proxy_ssl_name lens.hplush.dev;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_connect_timeout 3s;
      proxy_send_timeout 5s;
      proxy_read_timeout 5s;
      proxy_next_upstream off;
    }

    # Astro fingerprints these files; pages and public assets can change in place.
    location /_astro/ {
      expires 1y;
      try_files $uri =404;
    }

    location = /404.html {
      internal;
    }
  }
}
