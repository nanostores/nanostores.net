name: Start Preview Deployment
on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js, pnpm and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          require-lockfile: true
      - name: Build site
        run: pnpm run build
      - name: Build Docker image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          docker build --provenance=false \
            --output=type=docker,oci-mediatypes=false \
            -t "ghcr.io/nanostores/nanostores.net:preview-$PR_NUMBER" .
          docker save -o image.tar "ghcr.io/nanostores/nanostores.net:preview-$PR_NUMBER"
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > ./preview-id
      - name: Save image for deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-image
          retention-days: 1
          if-no-files-found: error
          path: |
            preview-id
            image.tar
