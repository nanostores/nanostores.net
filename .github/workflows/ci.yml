name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    name: Build and check site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js, pnpm and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - name: Check formatting
        run: pnpm run format:check
      - name: Build and check content, navigation and API
        run: pnpm run check
      - name: Check size
        run: pnpm run check:size
      - name: Pack build artifacts
        run: tar -cf dist.tar dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist.tar
          retention-days: 1
          if-no-files-found: error

  image:
    name: Build and check image
    runs-on: ubuntu-latest
    needs: site
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Unpack build artifacts
        run: tar -xf dist.tar && rm dist.tar
      - name: Build Docker image
        # Podman reads the embedded HEALTHCHECK from Docker-format images.
        run: docker build --provenance=false --output=type=docker,oci-mediatypes=false -t nanostores-site:ci .
      - name: Check static container
        run: |
          docker run --detach --name nanostores-site \
            --read-only --tmpfs /run --tmpfs /var/lib/nginx/tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --publish 127.0.0.1:8000:8000 nanostores-site:ci
          trap 'docker logs nanostores-site; docker rm -f nanostores-site' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 \
            --retry-connrefused --retry-all-errors http://127.0.0.1:8000/ > /dev/null
          docker exec nanostores-site /bin/httpcheck http://localhost:8000/
          for path in /docs/ /docs/getting-started/ /docs/api/ /llms.txt /llms-full.txt /llms-small.txt /icon.svg /manifest.webmanifest; do
            curl --fail --silent --show-error "http://127.0.0.1:8000$path" > /dev/null
          done
          asset=$(find dist/_astro -type f -name '*.css' -print -quit)
          test -n "$asset"
          curl --fail --silent --show-error "http://127.0.0.1:8000/${asset#dist/}" > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/missing-page)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/event)" = 405
      - name: Pack Docker image
        if: github.event_name == 'push' && github.repository == 'nanostores/nanostores.net'
        run: docker save -o image.tar nanostores-site:ci
      - name: Upload Docker image
        if: github.event_name == 'push' && github.repository == 'nanostores/nanostores.net'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'nanostores/nanostores.net'
    permissions:
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: publish-image
      cancel-in-progress: false
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Load Docker image
        run: docker load -i image.tar
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: |
          docker tag nanostores-site:ci ghcr.io/nanostores/nanostores.net:latest
          docker push ghcr.io/nanostores/nanostores.net:latest
      - name: Deploy image
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let token = await core.getIDToken('https://api.cloud.hplush.dev')
            let response = await fetch(
              'https://api.cloud.hplush.dev/deploy/nanostores.net',
              { method: 'POST', headers: { authorization: `Bearer ${token}` } }
            )
            let answer = await response.text()
            if (response.ok) core.info(answer)
            else core.setFailed(`${response.status} ${response.statusText}: ${answer}`)
      - name: Clean previous images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS="orgs/nanostores/packages/container/nanostores.net/versions"
          IDS=$(gh api --paginate "$VERSIONS?per_page=100" \
            | jq -r '.[] | select(.metadata.container.tags == []) | .id')
          if [ -n "$IDS" ]; then
            for ID in $IDS; do
              echo "Deleting version $ID"
              gh api -X DELETE "$VERSIONS/$ID" --silent
            done
          else
            echo "No untagged images"
          fi
