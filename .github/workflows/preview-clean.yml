name: Clean Preview
on:
  workflow_run:
    workflows:
      - Close Preview
    types:
      - completed
permissions:
  actions: read
  deployments: write
  id-token: write
  packages: write
jobs:
  clean:
    name: Clean
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.repository == 'nanostores/nanostores.net'
    concurrency:
      group: deploy-preview-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Download PR number from close step
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-id
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./untrusted/
      - name: Extract PR number
        id: pr
        run: |
          PR_NUMBER=$(cat ./untrusted/preview-id)
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid preview-id: $PR_NUMBER"
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Disable deployments at GitHub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          API="repos/$GITHUB_REPOSITORY"
          DEPLOYS=$(gh api "$API/deployments?environment=preview-$PR_NUMBER" --jq '.[].id')
          for ID in $DEPLOYS; do
            gh api "$API/deployments/$ID/statuses" -f state=inactive > /dev/null
            gh api -X DELETE "$API/deployments/$ID" --silent
          done
      - name: Clean the preview
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            let token = await core.getIDToken('https://api.cloud.hplush.dev')
            let response = await fetch(
              `https://api.cloud.hplush.dev/deploy/preview-${process.env.PR_NUMBER}.nanostores.hplush.dev`,
              { method: 'DELETE', headers: { authorization: `Bearer ${token}` } }
            )
            let answer = await response.text()
            if (response.ok) core.info(answer)
            else core.setFailed(`${response.status} ${response.statusText}: ${answer}`)
      - name: Delete preview image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          VERSIONS="orgs/nanostores/packages/container/nanostores.net/versions"
          # The preview image is pushed with the single `preview-N` tag
          ID=$(gh api --paginate "$VERSIONS?per_page=100" \
            | jq -r --arg tag "preview-$PR_NUMBER" \
              '.[] | select(.metadata.container.tags == [$tag]) | .id')
          if [ -n "$ID" ]; then
            echo "Deleting version $ID"
            gh api -X DELETE "$VERSIONS/$ID" --silent
          else
            echo "No image for preview-$PR_NUMBER"
          fi
